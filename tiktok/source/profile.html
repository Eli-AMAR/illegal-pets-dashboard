<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Archivo Black'; font-style: normal; font-weight: 400; src: url(fonts/ArchivoBlack-400.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 800; src: url(fonts/Inter-800.woff2) format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  #stage { position: absolute; inset: 0;
    background: radial-gradient(circle at 38% 30%, var(--bgHi) 0%, var(--bg1) 46%, var(--bg2) 100%); }
  #glyphs { position: absolute; inset: 0; }
  /* TikTok crops the avatar to a circle: everything important stays well inside it */
  #ring { position: absolute; inset: 74px; border-radius: 50%; border: 10px solid var(--ring);
    box-shadow: 0 0 110px var(--glow), inset 0 0 90px rgba(0,0,0,.35); }
  #ring2 { position: absolute; inset: 108px; border-radius: 50%; border: 3px solid var(--ring2); opacity: .75; }
  #sym { position: absolute; left: 50%; top: 49%; transform: translate(-50%,-52%);
    font-family: 'Archivo Black'; font-size: 560px; line-height: 1; color: var(--sym);
    text-shadow: 0 24px 90px rgba(0,0,0,.55), 0 0 130px var(--glow); }
  #sub { position: absolute; left: 50%; top: 796px; transform: translateX(-50%);
    font: 800 47px 'Inter'; letter-spacing: .30em; text-indent: .30em; white-space: nowrap;
    color: var(--sub); }
  .boxed { background: var(--boxBg); color: var(--boxInk) !important; padding: 6px 26px; border-radius: 18px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="glyphs" width="1080" height="1080"></canvas>
  <div id="ring"></div>
  <div id="ring2"></div>
  <div id="sym">π</div>
  <div id="sub">MATHS</div>
</div>
<script>
'use strict';
const VARIANTS = {
  gold: { bgHi:'#1C2C55', bg1:'#0E1630', bg2:'#080C1C', ring:'#F5C542', ring2:'rgba(245,197,66,.45)',
          glow:'rgba(245,197,66,.30)', sym:'#F5C542', sub:'rgba(255,255,255,.92)', sym_ch:'π', sub_tx:'MATHS' },
  blue: { bgHi:'#1B2C5E', bg1:'#0C1330', bg2:'#070B1A', ring:'#4F8CFF', ring2:'rgba(79,140,255,.45)',
          glow:'rgba(79,140,255,.42)', sym:'#FFFFFF', sub:'#4F8CFF', sym_ch:'π', sub_tx:'MATHS' },
  fx:   { bgHi:'#173A3B', bg1:'#0A1F22', bg2:'#061114', ring:'#2EE6A8', ring2:'rgba(46,230,168,.45)',
          glow:'rgba(46,230,168,.30)', sym:'#2EE6A8', sub:'rgba(255,255,255,.92)', sym_ch:'ƒ(x)', sub_tx:'MATHS' },
};
const GLYPH_CHARS = ['∫','Σ','√','∞','θ','Δ','λ','±','÷','≥','α','∂','ℝ','φ','×','='];
function rng(seed) { let a = seed >>> 0; return () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

window.RENDER = function (name) {
  const v = VARIANTS[name];
  const st = document.documentElement.style;
  for (const k of ['bgHi','bg1','bg2','ring','ring2','glow','sym','sub','boxBg','boxInk'])
    if (v[k]) st.setProperty('--' + k, v[k]);
  const sym = document.getElementById('sym');
  sym.textContent = v.sym_ch;
  if (v.sym_ch.length > 1) sym.style.fontSize = '300px';
  if (v.boxSym) sym.className = 'boxed';
  document.getElementById('sub').textContent = v.sub_tx;

  const r = rng(99), ctx = document.getElementById('glyphs').getContext('2d');
  ctx.clearRect(0, 0, 1080, 1080);
  for (let i = 0; i < 26; i++) {
    const size = 40 + r() * 110, x = r() * 1080, y = r() * 1080;
    ctx.save(); ctx.translate(x, y); ctx.rotate((r() - .5) * .8);
    ctx.font = `400 ${size}px 'Archivo Black'`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (r() < .35) { ctx.strokeStyle = `rgba(255,255,255,${.05 + r() * .06})`; ctx.lineWidth = 2; ctx.strokeText(GLYPH_CHARS[i % GLYPH_CHARS.length], 0, 0); }
    else { ctx.fillStyle = `rgba(255,255,255,${.04 + r() * .05})`; ctx.fillText(GLYPH_CHARS[i % GLYPH_CHARS.length], 0, 0); }
    ctx.restore();
  }
};
</script>
</body>
</html>
